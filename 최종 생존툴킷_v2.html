<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교환학생 생존 툴킷</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f4; --surface:#ffffff; --ink:#1b2430; --muted:#5d6877; --line:#cfd6de;
  --accent:#0b5fff; --accent-ink:#ffffff; --err:#b42318; --err-bg:#fdecea;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151c; --surface:#18202a; --ink:#e8edf3; --muted:#9aa6b5; --line:#2c3643;
    --accent:#6ea0ff; --accent-ink:#0a1220; --err:#ff8a80; --err-bg:#3a1c1a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --ink:#e8edf3; --muted:#9aa6b5; --line:#2c3643;
  --accent:#6ea0ff; --accent-ink:#0a1220; --err:#ff8a80; --err-bg:#3a1c1a; color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
h1{font-size:1.5rem;font-weight:900;margin:0;letter-spacing:-.02em}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.theme{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem;white-space:nowrap}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tab{border:0;background:transparent;color:var(--muted);padding:12px 8px;font-weight:700}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 18px;margin-top:14px}
.panel[hidden]{display:none}
label{display:block;font-weight:700;margin-bottom:6px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.15rem;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:0 18px;font-weight:700}
.swap{margin-top:12px;background:none;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:.85rem}
.out{margin-top:20px;min-height:84px}
.big{font-size:2.6rem;font-weight:900;letter-spacing:-.03em;line-height:1.15;word-break:break-all}
.note{color:var(--muted);font-size:.9rem;margin-top:4px}
.msg{background:var(--err-bg);color:var(--err);border-radius:8px;padding:10px 12px;font-weight:500}
.grades{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:10px;margin-top:6px}
.grades div{border:1px solid var(--line);border-radius:8px;padding:12px}
.grades .big{font-size:2rem}
.grades small{color:var(--muted);display:block}
details{margin-top:18px;font-size:.9rem}
summary{cursor:pointer;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin-top:8px;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.foot{margin-top:22px;color:var(--muted);font-size:.8rem}

@media (max-width: 400px) {
  .grades{grid-template-columns:1fr 1fr}
  .grades > div:last-child { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>교환학생 생존 툴킷</h1>
      <p class="sub">평 → m², 한국 학점 → ECTS / 미국 4.0 / 백분위</p>
    </div>
    <button class="theme" id="theme" type="button" aria-pressed="false">다크 모드</button>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-housing" aria-selected="true" aria-controls="p-housing">단위 변환 (Housing)</button>
    <button class="tab" role="tab" id="t-grades" aria-selected="false" aria-controls="p-grades">학점 변환 (Grades)</button>
  </div>

  <section class="panel" id="p-housing" role="tabpanel" aria-labelledby="t-housing">
    <label for="area" id="area-label">평수 입력 (평)</label>
    <div class="row">
      <input type="text" id="area" inputmode="decimal" autocomplete="off" placeholder="예: 10">
      <button class="go" id="area-go" type="button">m²로 변환</button>
    </div>
    <button class="swap" id="swap" type="button">↔ m²를 평으로 바꾸기</button>
    <div class="out" id="area-out" aria-live="polite">
      <div class="big">-</div>
      <div class="note">값을 입력해주세요</div>
    </div>
  </section>

  <section class="panel" id="p-grades" role="tabpanel" aria-labelledby="t-grades" hidden>
    <label for="gpa">한국 학점 입력 (0 ~ 4.5)</label>
    <div class="row">
      <input type="text" id="gpa" inputmode="decimal" autocomplete="off" placeholder="예: 3.8">
      <button class="go" id="gpa-go" type="button">변환</button>
    </div>
    <div class="out" id="gpa-out" aria-live="polite">
      <div class="big">-</div>
      <div class="note">값을 입력해주세요</div>
    </div>
    <details>
      <summary>변환 기준표 보기</summary>
      <div class="scroll"><table id="table"></table></div>
    </details>
  </section>

  <p class="foot">모든 계산은 이 브라우저 안에서만 이루어지며 서버로 전송되지 않습니다. 학점 변환은 대략적인 추정치이니, 공식 환산은 파견 대학 기준을 확인하세요.</p>
</div>

<script>
(function(){
  var PY = 3.3058; // 1평 = 3.3058 m²
  var NUM_MSG = '숫자만 입력 가능합니다';
  var $ = function(id){ return document.getElementById(id); };

  // 한국 4.5 만점 기준 변환표 (+백분위 추가)
  var GRADE_TABLE = [
    { min:4.3, kr:'A+', us:'4.0', usL:'A',  ects:'A', pct:'95~100점' },
    { min:4.0, kr:'A0', us:'3.7', usL:'A-', ects:'A', pct:'90~94점' },
    { min:3.5, kr:'B+', us:'3.3', usL:'B+', ects:'B', pct:'85~89점' },
    { min:3.0, kr:'B0', us:'3.0', usL:'B',  ects:'B', pct:'80~84점' },
    { min:2.5, kr:'C+', us:'2.3', usL:'C+', ects:'C', pct:'75~79점' },
    { min:2.0, kr:'C0', us:'2.0', usL:'C',  ects:'D', pct:'70~74점' },
    { min:1.5, kr:'D+', us:'1.3', usL:'D+', ects:'E', pct:'65~69점' },
    { min:1.0, kr:'D0', us:'1.0', usL:'D',  ects:'E', pct:'60~64점' },
    { min:0,   kr:'F',  us:'0.0', usL:'F',  ects:'F', pct:'0~59점' }
  ];

  // 숫자 검증: 숫자 형식이 아니면 null
  function parse(v){
    v = String(v).trim();
    if (!/^\d*\.?\d+$|^\d+\.$/.test(v)) return null;
    return parseFloat(v);
  }
  function floor2(n){ return (Math.floor(n * 100 + 1e-9) / 100).toFixed(2); }
  function showMsg(el, text){
    el.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'msg'; d.textContent = text; el.appendChild(d);
  }

  // 탭
  function selectTab(name){
    ['housing','grades'].forEach(function(n){
      $('t-'+n).setAttribute('aria-selected', n === name);
      $('p-'+n).hidden = n !== name;
    });
  }
  $('t-housing').onclick = function(){ selectTab('housing'); };
  $('t-grades').onclick = function(){ selectTab('grades'); };

  // 단위 변환 (평 ↔ m²) - 빈칸 초기화 적용
  var toM2 = true;
  function convertArea(){
    var out = $('area-out');
    var val = $('area').value.trim();
    if (val === '') {
      out.innerHTML = '<div class="big">-</div><div class="note">값을 입력해주세요</div>';
      return;
    }
    
    var n = parse(val);
    if (n === null){ showMsg(out, NUM_MSG); return; }
    
    var res = toM2 ? floor2(n * PY) + 'm²' : floor2(n / PY) + '평';
    var from = toM2 ? n + '평' : n + 'm²';
    out.innerHTML = '<div class="big"></div><div class="note"></div>';
    out.firstChild.textContent = res;
    out.lastChild.textContent = from + ' = ' + res + ' (1평 = 3.3058m²)';
  }
  
  $('area-go').onclick = convertArea;
  $('area').addEventListener('keydown', function(e){ if (e.key === 'Enter') convertArea(); });
  $('swap').onclick = function(){
    toM2 = !toM2;
    $('area-label').textContent = toM2 ? '평수 입력 (평)' : '면적 입력 (m²)';
    $('area-go').textContent = toM2 ? 'm²로 변환' : '평으로 변환';
    $('swap').textContent = toM2 ? '↔ m²를 평으로 바꾸기' : '↔ 평을 m²로 바꾸기';
    $('area-out').innerHTML = '<div class="big">-</div><div class="note">값을 입력해주세요</div>';
    $('area').value = '';
    $('area').focus();
  };

  // 학점 변환 - 빈칸 초기화 및 백분위 점수 적용
  function convertGpa(){
    var out = $('gpa-out');
    var val = $('gpa').value.trim();
    if (val === '') {
      out.innerHTML = '<div class="big">-</div><div class="note">값을 입력해주세요</div>';
      return;
    }
    
    var n = parse(val);
    if (n === null){ showMsg(out, NUM_MSG); return; }
    if (n > 4.5){ out.innerHTML = '<div class="big">-</div><div class="note">값을 다시 입력해주세요</div>'; alert('4.5 이하의 숫자를 입력해 주세요'); return; }
    
    var row = GRADE_TABLE.filter(function(r){ return n >= r.min; })[0];
    out.innerHTML =
      '<div class="grades">' +
      '<div><small>ECTS (유럽)</small><div class="big" id="r-ects"></div></div>' +
      '<div><small>4.0 만점 (미국)</small><div class="big" id="r-us"></div></div>' +
      '<div><small>백분위 점수</small><div class="big" id="r-pct" style="font-size:1.6rem;line-height:2.2rem;margin-top:6px;"></div></div>' +
      '</div><div class="note" id="r-note"></div>';
      
    $('r-ects').textContent = row.ects;
    $('r-us').textContent = row.us + ' (' + row.usL + ')';
    $('r-pct').textContent = row.pct;
    $('r-note').textContent = '한국 ' + n + ' (' + row.kr + ' 구간) 기준 추정치';
  }
  
  $('gpa-go').onclick = convertGpa;
  $('gpa').addEventListener('keydown', function(e){ if (e.key === 'Enter') convertGpa(); });

  // 기준표 렌더링
  var t = '<tr><th>한국 학점</th><th>등급</th><th>백분위</th><th>미국 4.0</th><th>ECTS</th></tr>';
  GRADE_TABLE.forEach(function(r, i){
    var hi = i === 0 ? 4.5 : (GRADE_TABLE[i-1].min - 0.01).toFixed(2);
    t += '<tr><td>' + r.min.toFixed(1) + ' ~ ' + hi + '</td><td>' + r.kr + '</td><td>' + r.pct + '</td><td>' + r.us + ' (' + r.usL + ')</td><td>' + r.ects + '</td></tr>';
  });
  $('table').innerHTML = t;

  // 다크 모드
  var root = document.documentElement;
  function setTheme(dark){
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    $('theme').setAttribute('aria-pressed', dark);
    $('theme').textContent = dark ? '라이트 모드' : '다크 모드';
  }
  setTheme(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  $('theme').onclick = function(){ setTheme(root.getAttribute('data-theme') !== 'dark'); };
})();
</script>
</body>
</html>
